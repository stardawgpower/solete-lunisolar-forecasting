[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solete-lunisolar-forecasting"
version = "0.1.0"
description = "Cross-dataset study of astronomical and Panchang representations for photovoltaic forecasting"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.0.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "h5py==3.16.0",
    "matplotlib==3.11.1",
    "pvlib==0.15.2",
    "skyfield==1.55",
    "pyswisseph==2.10.3.2",
]

[project.optional-dependencies]

ml = [
    "scikit-learn==1.9.0",
    "lightgbm==4.7.0",
    "xgboost==3.4.1",
]

dl = [
    "tensorflow==2.18.1",
    "keras==3.15.1",
    "tensorflow-metal==1.2.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

notebook = [
    "jupyter==1.1.1",
    "jupyterlab==4.6.3",
    "notebook==7.6.2",
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
]

dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

py-modules = [
    "astronomy_features",
    "data_loader",
    "feature_families",
    "preprocessing",
    "representation_controls",
    "vedic_calendar",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
